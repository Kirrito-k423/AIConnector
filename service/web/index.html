<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIConnector · 实验交接</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">AI<span>Connector</span></div><div id="node" class="pill">正在连接</div><a id="repo" target="_blank" rel="noreferrer">打开 Relay ↗</a></header>
<main><section class="heading"><div><div class="eyebrow">跨网络实验工作台</div><h1>每一次实验，都有迹可循。</h1><p>从任务发布到结果回执，在两端保留完整记录。</p></div><button id="refresh">立即同步</button></section>
<div id="notice" role="status"></div><section id="stats" class="stats"></section>
<section class="workspace"><div class="queue"><div class="bar"><h2>任务运行</h2><select id="filter"><option value="all">全部</option><option value="active">处理中</option><option value="confirmed">已回执</option><option value="error">需要处理</option></select></div><div id="runs"></div></div><section id="detail" class="detail"><p class="empty">选择一个运行，查看时间线和交付件。</p></section></section>
<details id="submit"><summary>发布实验任务</summary><p>选择接收端已经配置的实验入口。修改任务内容请增加 revision；重复运行请更换 run_id。</p><form id="task-form"><label>任务 JSON<textarea id="task-json" rows="18" spellcheck="false"></textarea></label><label>输入 ZIP（可选，小于 5 MiB）<input id="zip" type="file" accept=".zip"></label><button type="submit">发布到 Relay</button></form></details>
<details id="settings"><summary>连接设置</summary><p>密钥只保存到本机 Windows DPAPI / macOS 钥匙串，不写入任务、日志或 ZIP。</p><form id="settings-form"><div class="fields"><label>GitHub Token<input id="github-token" type="password" autocomplete="new-password" placeholder="留空保留已有值"></label><label>AI API Key<input id="api-key" type="password" autocomplete="new-password" placeholder="留空保留已有值"></label><label>API 协议<select id="model-api"><option value="openai-completions">OpenAI Chat Completions</option><option value="openai-responses">OpenAI Responses</option><option value="anthropic-messages">Anthropic Messages</option></select></label><label>Base URL<input id="model-base" type="url" placeholder="https://your-api.example/v1"></label><label>模型 ID<input id="model-id" placeholder="提供商的模型标识"></label></div><button type="submit">保存本机设置</button></form></details>
<footer>“已领取”表示执行责任已登记；“已回执”表示文件完整收到。实验是否达标，请结合指标和产物判断。</footer></main><script src="/app.js"></script></body></html>
