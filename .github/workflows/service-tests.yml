name: Service and portable package acceptance
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional public candidate tag to download and verify
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows-service:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Diagnose native and isolated PowerShell startup
        run: node tools/diagnose_windows_runtime.mjs
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm test
      - name: Build offline Windows delivery
        run: python tools/build_service.py
      - name: Fresh extraction, real Pi, PowerShell 5.1, reboot and network faults
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python tools/validate_service_bundle.py dist/service/AIConnector-Service-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tested-service-windows-x64
          path: dist/service/*
      - name: Public release download and fresh installation acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python tools/validate_service_release.py $env:RELEASE_TAG
