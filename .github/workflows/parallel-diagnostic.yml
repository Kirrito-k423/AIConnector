name: Windows parallel regression diagnosis
on:
  pull_request:
    paths:
      - 'tests/service/parallel.test.mjs'
      - 'service/runner.mjs'
      - 'service/common.mjs'
      - 'service/worker.mjs'
      - '.github/workflows/parallel-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: python tools/build_service.py
      - name: Repeat the isolated-process regression in the actual Windows package
        env:
          PYTHONUTF8: '1'
        run: python tools/validate_service_bundle.py dist/service/AIConnector-Service-windows-x64.zip --parallel-repeats 32
